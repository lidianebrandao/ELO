name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Preparar arquivos do site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Preparar pasta de publicacao
        run: |
          mkdir -p _site
          cp index.html styles.css script.js favicon.svg _site/

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
